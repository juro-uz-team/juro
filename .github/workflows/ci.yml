name: Native application validation
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches: [refactor/self-hosted-postgres, 'deploy/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17-bookworm
        env:
          POSTGRES_USER: juro
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: juro
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U juro"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://juro:isolated-ci-only@127.0.0.1:55432/juro
      PRIVATE_DEVELOPMENT: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/platform/package-lock.json
            apps/website/package-lock.json
      - name: Install application dependencies
        run: npm ci --prefix apps/platform && npm ci --prefix apps/website
      - name: Install document tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-rus tesseract-ocr-uzb tesseract-ocr-uzb-cyrl clamav
      - name: Initialize malware signatures
        run: sudo systemctl stop clamav-freshclam || true; sudo freshclam
      - name: Initialize PostgreSQL
        working-directory: apps/platform
        run: npm run db:migrate
      - name: Type-check applications
        run: npm run type-check --prefix apps/platform && npm run type-check --prefix apps/admin && npm run type-check --prefix apps/website
      - name: Production builds
        run: npm run build --prefix apps/platform && npm run build --prefix apps/website
      - name: Platform tests
        run: npm test --prefix apps/platform
      - name: Install authentication test browser
        working-directory: apps/platform
        run: npx playwright install --with-deps chromium
      - name: Authentication browser tests
        run: npm run test:auth-browser --prefix apps/platform
      - name: Native HTTP boundary tests
        run: node --test scripts/native-http.test.mjs scripts/native-admin-http.test.mjs scripts/public-build-origins.test.mjs scripts/native-readiness.test.mjs scripts/deployment-gateway.test.mjs scripts/check-migration-recovery.test.mjs scripts/deploy-self-hosted.test.mjs scripts/corpus-deployment-hook.test.mjs scripts/public-dns-readiness.test.mjs
      - name: Website tests
        working-directory: apps/website
        run: node --test tests/*.test.mjs
      - name: Dependency licences
        run: npm run license:check --prefix apps/platform && npm run license:check --prefix apps/website
